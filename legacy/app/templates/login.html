<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A4A">
  <title>Sign in · SolarStock Warehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div>
    <div class="card login-card shadow">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <span class="brand-mark brand-mark-lg mx-auto mb-3" aria-hidden="true"><i class="fa-solid fa-solar-panel"></i></span>
          <h3 class="login-brand mt-2 mb-1">SolarStock Warehouse</h3>
          <p class="text-muted mb-0">Inventory &amp; delivery management</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" autofocus required autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required autocomplete="current-password">
          </div>
          <button class="btn btn-brand w-100 btn-touch">Sign in</button>
        </form>
      </div>
    </div>
    <div class="login-credit">
      <img class="brand-logo-pfs-footer" src="{{ url_for('static', filename='img/pfs-logo.png') }}" alt="PFS Automation Microsystems">
      <span class="footer-sep" aria-hidden="true">·</span>
      <span class="powered-by">Powered by</span>
      <img class="brand-logo-casin brand-logo-casin-on-dark" src="{{ url_for('static', filename='img/casinworks-logo.png') }}" alt="CasinWorks">
    </div>
  </div>
</div>
</body>
</html>
